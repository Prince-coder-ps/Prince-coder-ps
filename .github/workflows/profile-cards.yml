name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: prince-coder-ps
          cards: overview,contributions,lifetime,cadence,languages
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): update GitHub analytics"
